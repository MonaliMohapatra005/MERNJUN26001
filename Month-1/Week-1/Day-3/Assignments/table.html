<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="2">
        <tr>
            <th rowspan="3">day</th>
            <th colspan="3">seminar</th>
        </tr>
        <tr>
            <th colspan="2">schedule</th>
            <th>topic</th>
        </tr>
        <tr>
            <th>begin</th>
            <th>end</th>
        </tr>
        <tr>
            <td rowspan="2">monday</td>
            <td rowspan="2">8:00 am</td>
            <td rowspan="2">5:00 pm</td>
            <td>introduction to XML</td>
        </tr>
        <tr>
            <td> validity DTD and relax </td>
        </tr>
        <tr>
            <td rowspan="3">tuesday</td>
            <td>8 am</td>
            <td>11 am</td>
            <td rowspan="2">XPath</td>
        </tr>
        <tr>
            <td>11am</td>
            <td>2pm</td>
        </tr>
        <tr>
            <td>2pm</td>
            <td>5pm</td>
            <td rowspan="1"> XSL Transformations</td>
>
        </tr>
        <tr>
            <td>wednesday</td>
            <td>8am</td>
            <td>12pm</td>
            <td>XSL formatting object</td>
        </tr>

    </table>
</body>
</html>
