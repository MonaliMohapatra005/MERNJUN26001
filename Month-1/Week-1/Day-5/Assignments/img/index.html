<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            background-color: rgb(187, 197, 193);
            width: 400px;
            height: 500px;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        img{
            height: 300px;
            width: 200px;
        }
         .middle{
            background-color: rgb(0, 0, 0);
            width: 300px;
            height: 400px;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        .inner{
            background-color: rgb(219, 227, 224);
            width: 200px;
            height: 300px;
            justify-content: center;
            align-items: center;
            display: flex;
        }


    
    </style>
</head>
<body>
    <div class="outer">
       <div class="middle">
          <div class="inner">
            <img src="tree.webp" alt="tree">
          </div>
       </div>
    </div>
</body>
</html>
