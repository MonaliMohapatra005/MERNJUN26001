<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
        <link rel="stylesheet" href="styles.css">

    <style>
        p {
            color: blueviolet;
        }
        h2{
            background-color: #5b136b;
        }
    </style>

<body>

    <video 
    width="400" 
    height="200" 
    src="./video/WhatsApp Video 2026-06-11 at 11.37.12 AM.mp4"

    loop
    controls>    
    </video>

        <option value="">html</option>

    </select>
    <h1>TEXTAREA</h1>
    <textarea 
    name="" 
    id=""
    rows="4"
    cols="6"
    ></textarea>

    <!-- semantic -->
     <nav>nav bar</nav>

     <!-- non-semantic -->
      <div style="background-color: aqua;">block-level element</div>
      <span style="background-color: rgb(59, 144, 144);">in-line element</span>
